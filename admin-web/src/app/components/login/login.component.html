        <i class="bi bi-leaf-fill me-2"></i>NutriTEC
      </h2>
      <p class="text-muted mb-0">Inicio sesión Administrador</p>
    </div>

    <!-- Alertas globales -->
    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
    <div *ngIf="mensaje" class="alert alert-success py-2">{{ mensaje }}</div>
    <div *ngIf="emailNoEncontrado" class="alert alert-warning py-2">
      Correo o contraseña incorrectos.
    </div>
    <div *ngIf="emailYaRegistrado" class="alert alert-warning py-2">
      Ya existe una cuenta con ese correo.
    </div>

    <!-- ===================== LOGIN ===================== -->
    <div *ngIf="modo === 'login'">
      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="loginEmail" placeholder="correo@ejemplo.com">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="loginPassword" placeholder="••••••••"
               (keyup.enter)="iniciarSesion()">
      </div>
      <button class="btn btn-primary w-100" (click)="iniciarSesion()" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
        Ingresar
      </button>
    </div>
