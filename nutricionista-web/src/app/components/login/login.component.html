<div class="login-page">

  <!-- Header -->
  <header class="login-header">
    <div class="header-content">
      <img src="assets/logo.png" alt="NutriTEC" class="login-logo" />
      <div>
        <h1>NutriTEC</h1>
        <p>Portal para Nutricionistas</p>
      </div>
    </div>
  </header>

  <main class="login-main">
    <div class="auth-card">

      <div class="tabs">
        <button [class.active]="modo === 'login'" (click)="cambiarModo('login')">
          Iniciar Sesión
        </button>

        <button [class.active]="modo === 'registro'" (click)="cambiarModo('registro')">
          Registrarse
        </button>
      </div>

      <!-- LOGIN -->
      <form *ngIf="modo === 'login'" (ngSubmit)="iniciarSesion()" class="auth-form">

        <p class="form-subtitle">
          Ingrese su correo electrónico y contraseña.
        </p>

        <p class="msg-error" *ngIf="error">{{ error }}</p>

        <div class="field">
          <label>Correo electrónico</label>
          <input type="email" [(ngModel)]="loginEmail" name="loginEmail" required />
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input type="password" [(ngModel)]="loginPassword" name="loginPassword" required />
        </div>

        <button type="submit" class="btn-primary" [disabled]="cargando">

          {{ cargando ? 'Verificando...' : 'Ingresar' }}
        </button>

        <p class="toggle-hint">
          ¿No posee una cuenta?
          <a (click)="cambiarModo('registro')">
            Regístrese aquí
          </a>
        </p>
      </form>
      <!-- REGISTRO -->
      <form *ngIf="modo === 'registro'" (ngSubmit)="registrarse()" class="auth-form">

        <p class="form-subtitle">
          Registro de Nutricionista
        </p>

        <div class="steps-indicator">
          <span [class.active]="pasoRegistro === 1">1. Datos personales</span>
          <span [class.active]="pasoRegistro === 2">2. Información profesional</span>
          <span [class.active]="pasoRegistro === 3">3. Cuenta</span>
        </div>

        <p class="msg-error" *ngIf="error">{{ error }}</p>
        <p class="msg-success" *ngIf="mensaje">{{ mensaje }}</p>

        <!-- PASO 1 -->
        <div *ngIf="pasoRegistro === 1" class="form-grid">

          <div class="field">
            <label>Cédula *</label>
            <input type="text" [(ngModel)]="formulario.cedula" name="cedula" required>
          </div>

          <div class="field">
            <label>Nombre *</label>
            <input type="text" [(ngModel)]="formulario.nombre" name="nombre" required>
          </div>

          <div class="field">
            <label>Primer apellido *</label>
            <input type="text" [(ngModel)]="formulario.apellido1" name="apellido1" required>
          </div>

          <div class="field">
            <label>Segundo apellido</label>
            <input type="text" [(ngModel)]="formulario.apellido2" name="apellido2">
          </div>
          <!-- 
          <div class="field">
            <label>Edad *</label>
            <input type="number" [(ngModel)]="formulario.edad" name="edad" required>
          </div> -->

          <div class="field">
            <label>Fecha de nacimiento *</label>
            <input type="date" [(ngModel)]="formulario.fechaNacimiento" name="fechaNacimiento" required>
          </div>

          <div class="field field-full">
            <label>Dirección *</label>
            <input type="text" [(ngModel)]="formulario.direccion" name="direccion" required>
          </div>

          <div class="buttons-row">
            <button type="button" class="btn-primary" (click)="siguientePaso()">
              Siguiente
            </button>
          </div>

        </div>

        <!-- PASO 2 -->
        <div *ngIf="pasoRegistro === 2" class="form-grid">

          <div class="field">
            <label>Código de Nutricionista *</label>
            <input type="text" [(ngModel)]="formulario.codigoNutricionista" name="codigoNutricionista" required>
          </div>

          <div class="field">
            <label>Peso (kg) *</label>
            <input type="number" step="0.01" [(ngModel)]="formulario.peso" name="peso" required>
          </div>

          <div class="field">
            <label>IMC *</label>
            <input type="number" step="0.01" [(ngModel)]="formulario.imc" name="imc" required>
          </div>

          <div class="field">
            <label>URL de la fotografía</label>
            <input type="url" [(ngModel)]="formulario.foto" name="foto" placeholder="https://ejemplo.com/foto.jpg" />
          </div>

          <div class="buttons-row">
            <button type="button" class="btn-primary" (click)="pasoAnterior()">
              Anterior
            </button>

            <button type="button" class="btn-primary" (click)="siguientePaso()">
              Siguiente
            </button>
          </div>

        </div>

        <!-- PASO 3 -->
        <div *ngIf="pasoRegistro === 3" class="form-grid">

          <div class="field">
            <label>Número de tarjeta *</label>
            <input type="text" [(ngModel)]="formulario.numeroTarjeta" name="numeroTarjeta" required>
          </div>

          <div class="field">
            <label>Tipo de cobro *</label>
            <select [(ngModel)]="formulario.tipoCobro" name="tipoCobro" required>

              <option value="SEMANAL">Semanal</option>
              <option value="MENSUAL">Mensual</option>
              <option value="ANUAL">Anual</option>

            </select>
          </div>

          <div class="field">
            <label>Correo electrónico *</label>
            <input type="email" [(ngModel)]="formulario.email" name="email" required>
          </div>

          <div class="field">
            <label>Contraseña *</label>
            <input type="password" [(ngModel)]="formulario.passwordEncriptado" name="password" required>
          </div>

          <div class="buttons-row">
            <button type="button" class="btn-primary" (click)="pasoAnterior()">
              Anterior
            </button>

            <button type="submit" class="btn-primary" [disabled]="cargando">
              {{ cargando ? 'Registrando...' : 'Crear cuenta' }}
            </button>
          </div>

        </div>

      </form>

    </div>
  </main>

  <footer class="login-footer">
    <p>&copy; 2026 NutriTEC</p>
  </footer>

</div>
