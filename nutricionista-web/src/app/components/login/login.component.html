<div class="login-wrapper">
  <div class="login-card">
    <!-- Logo / Header -->
    <div class="text-center mb-4">
      <h2 class="fw-bold" style="color: #1b5e20;">
        <i class="bi bi-leaf-fill me-2"></i>NutriTEC
      </h2>
      <p class="text-muted mb-0">Portal del Nutricionista</p>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-pills nav-fill mb-4">
      <li class="nav-item">
        <button class="nav-link" [class.active]="modo === 'login'" (click)="cambiarModo('login')">
          Iniciar Sesión
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" [class.active]="modo === 'registro'" (click)="cambiarModo('registro')">
          Registrarse
        </button>
      </li>
    </ul>

    <!-- Alertas globales -->
    <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>
    <div *ngIf="mensaje" class="alert alert-success py-2">{{ mensaje }}</div>
    <div *ngIf="emailNoEncontrado" class="alert alert-warning py-2">
      Correo o contraseña incorrectos.
    </div>
    <div *ngIf="emailYaRegistrado" class="alert alert-warning py-2">
      Ya existe una cuenta con ese correo.
    </div>

    <!-- ===================== LOGIN ===================== -->
    <div *ngIf="modo === 'login'">
      <div class="mb-3">
        <label class="form-label fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" [(ngModel)]="loginEmail" placeholder="correo@ejemplo.com">
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Contraseña</label>
        <input type="password" class="form-control" [(ngModel)]="loginPassword" placeholder="••••••••"
          (keyup.enter)="iniciarSesion()">
      </div>
      <button class="btn btn-primary w-100" (click)="iniciarSesion()" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
        Ingresar
      </button>
    </div>

    <!-- ===================== REGISTRO ===================== -->
    <div *ngIf="modo === 'registro'">
      <!-- Indicador de pasos -->
      <div class="step-indicator justify-content-center mb-4">
        <div class="step" [class.active]="pasoRegistro === 1" [class.done]="pasoRegistro > 1">1</div>
        <div class="step" [class.active]="pasoRegistro === 2" [class.done]="pasoRegistro > 2">2</div>
        <div class="step" [class.active]="pasoRegistro === 3">3</div>
      </div>

      <!-- PASO 1: Datos personales -->
      <div *ngIf="pasoRegistro === 1">
        <h6 class="text-muted mb-3">Paso 1 — Datos Personales</h6>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label">Cédula *</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.cedula">
          </div>
          <div class="col-6">
            <label class="form-label">Fecha Nacimiento *</label>
            <input type="date" class="form-control" [(ngModel)]="formulario.fechaNacimiento">
          </div>
          <div class="col-12">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.nombre" placeholder="Nombre">
          </div>
          <div class="col-6">
            <label class="form-label">Primer Apellido *</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.apellido1">
          </div>
          <div class="col-6">
            <label class="form-label">Segundo Apellido</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.apellido2">
          </div>
          <div class="col-12">
            <label class="form-label">Dirección *</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.direccion">
          </div>
        </div>
        <div class="d-flex justify-content-end mt-3">
          <button class="btn btn-primary" (click)="siguientePaso()">Siguiente <i class="bi bi-arrow-right"></i></button>
        </div>
      </div>

      <!-- PASO 2: Información profesional -->
      <div *ngIf="pasoRegistro === 2">
        <h6 class="text-muted mb-3">Paso 2 — Información Profesional</h6>
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label">Código de Nutricionista *</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.codigoNutricionista">
          </div>
          <div class="col-6">
            <label class="form-label">Peso (kg) *</label>
            <input type="number" class="form-control" [(ngModel)]="formulario.peso" step="0.01">
          </div>
          <div class="col-6">
            <label class="form-label">IMC *</label>
            <input type="number" class="form-control" [(ngModel)]="formulario.imc" step="0.01">
          </div>
          <div class="col-12">
            <label class="form-label">URL de la fotografía</label>
            <input type="url" class="form-control" [(ngModel)]="formulario.foto"
              placeholder="https://ejemplo.com/foto.jpg">
          </div>
        </div>
        <div class="d-flex justify-content-between mt-3">
          <button class="btn btn-outline-secondary" (click)="pasoAnterior()">
            <i class="bi bi-arrow-left"></i> Anterior
          </button>
          <button class="btn btn-primary" (click)="siguientePaso()">Siguiente <i class="bi bi-arrow-right"></i></button>
        </div>
      </div>

      <!-- PASO 3: Cuenta -->
      <div *ngIf="pasoRegistro === 3">
        <h6 class="text-muted mb-3">Paso 3 — Cuenta</h6>
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label">Número de tarjeta *</label>
            <input type="text" class="form-control" [(ngModel)]="formulario.numeroTarjeta">
          </div>
          <div class="col-6">
            <label class="form-label">Tipo de cobro *</label>
            <select class="form-select" [(ngModel)]="formulario.tipoCobro">
              <option value="Semanal">Semanal</option>
              <option value="Mensual">Mensual</option>
              <option value="Anual">Anual</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Correo electrónico *</label>
            <input type="email" class="form-control" [(ngModel)]="formulario.email" placeholder="correo@ejemplo.com">
          </div>
          <div class="col-12">
            <label class="form-label">Contraseña *</label>
            <input type="password" class="form-control" [(ngModel)]="formulario.passwordEncriptado"
              placeholder="••••••••">
          </div>
        </div>
        <div class="d-flex justify-content-between mt-3">
          <button class="btn btn-outline-secondary" (click)="pasoAnterior()">
            <i class="bi bi-arrow-left"></i> Anterior
          </button>
          <button class="btn btn-primary" (click)="registrarse()" [disabled]="cargando">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
            Crear Cuenta
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
