<div class="d-flex" style="min-height:100vh;">
  <!-- ======================== SIDEBAR ======================== -->
  <nav class="sidebar d-flex flex-column p-3 no-print" style="width:240px; flex-shrink:0;">
    <div class="text-center mb-4">
      <div class="fs-4 fw-bold"><i class="bi bi-leaf-fill"></i> NutriTEC</div>
      <small class="opacity-75">Portal Nutricionista</small>
    </div>

    <div class="mb-3 px-2" *ngIf="currentUser">
      <div class="fw-semibold">{{ currentUser.nombre }} {{ currentUser.apellido1 }}</div>
      <small class="opacity-75">{{ currentUser.email }}</small>
    </div>

    <hr class="border-light">

    <ul class="nav flex-column flex-grow-1">
      <li class="nav-item" *ngFor="let item of menu">
        <a class="nav-link" [routerLink]="['/dashboard', item.valor]" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }">
          <!-- <i class="bi me-2" [ngClass]="item.icono ?? 'bi-circle'"></i> -->
          {{ item.nombre }}
        </a>
      </li>
    </ul>

    <div class="mt-auto">
      <button class="btn btn-outline-light btn-sm w-100" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
      </button>
    </div>
  </nav>

  <!-- ======================== MAIN CONTENT ======================== -->
  <main class="flex-grow-1 page-content">
    <router-outlet />
  </main>
</div>
