<div class="d-flex" style="min-height:100vh;">
  <!-- ======================== SIDEBAR ======================== -->
  <nav class="sidebar d-flex flex-column p-3 no-print" style="width:240px; flex-shrink:0;">
    <div class="text-center mb-4">
      <div class="fs-4 fw-bold"><i class="bi bi-leaf-fill"></i> NutriTEC</div>
      <small class="opacity-75">Portal Paciente</small>
    </div>

    <div class="mb-3 px-2">
      <div class="fw-semibold">{{ usuario?.nombre }} {{ usuario?.apellido1 }}</div>
      <small class="opacity-75">{{ usuario?.email }}</small>
    </div>
    <hr class="border-light">

    <ul class="nav flex-column flex-grow-1">
      <li class="nav-item">
        <a class="nav-link" routerLink="consumo-diario" routerLinkActive="active">
          <i class="bi bi-journal-check me-2"></i>Registro Diario
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="productos" routerLinkActive="active">
          <i class="bi bi-upc-scan me-2"></i>Productos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="recetas" routerLinkActive="active">
          <i class="bi bi-book me-2"></i>Recetas
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="medidas" routerLinkActive="active">
          <i class="bi bi-rulers me-2"></i>Mis Medidas
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="reporte" routerLinkActive="active">
          <i class="bi bi-bar-chart-line me-2"></i>Reporte Avance
        </a>
      </li>
    </ul>

    <div class="mt-auto">
      <button class="btn btn-outline-light btn-sm w-100" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-left me-2"></i>Cerrar Sesión
      </button>
    </div>
  </nav>

  <!-- ======================== MAIN CONTENT ======================== -->
  <main class="flex-grow-1 page-content">
    <router-outlet />
  </main>
</div>
